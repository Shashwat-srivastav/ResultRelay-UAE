# United Arab Emirates — Charter for the Development and Use of Artificial Intelligence (10 June 2024)
# Status: public policy published on the official legislation portal. It is GUIDANCE, not legislation,
# and carries no penalty of its own — which is exactly why it is classified OFFICIAL_GUIDANCE and can
# never be promoted to a binding requirement by the gate.
source_id: U5
excerpts:
  - chunk_id: U5-p02-safety
    section_id: "Principle 2 (Safety)"
    page_start: 1
    page_end: 1
    claim_classification: OFFICIAL_GUIDANCE
    topics: [safety, risk, ai_governance, human_oversight]
    text: >-
      The UAE places great importance on safety, ensuring that all AI systems comply with the highest
      safety standards. The country encourages modifying or removing systems that pose risks.
    support_note: >-
      National expectation for AI safety. It is guidance: the gate treats it as a design input that can
      shape a control, never as a rule that authorises or forbids an action.

  - chunk_id: U5-p06-human-oversight
    section_id: "Principle 6 (Human Oversight)"
    page_start: 1
    page_end: 1
    claim_classification: OFFICIAL_GUIDANCE
    topics: [human_oversight, human_in_the_loop, accountability]
    text: >-
      The Charter emphasizes the irreplaceable value of human judgment and human oversight over AI,
      aligning with ethical values and social standards to correct any errors or biases that may arise.
    support_note: >-
      The national basis for the architecture decision that a model may propose but a deterministic
      gate decides: human judgement is described as irreplaceable, not as an optional review layer.

  - chunk_id: U5-p07-governance-accountability
    section_id: "Principle 7 (Governance and Accountability)"
    page_start: 1
    page_end: 1
    claim_classification: OFFICIAL_GUIDANCE
    topics: [governance, accountability, audit]
    text: >-
      The UAE adopts a responsible and proactive stance, emphasizing the importance of governance and
      accountability in AI to ensure the technology is used ethically and transparently.
    support_note: >-
      Supports the append-only audit trail and the requirement that every consequential action be
      attributable. Guidance again: the audit trail is a design control, not a quoted obligation.

  - chunk_id: U5-p05-transparency
    section_id: "Principle 5 (Transparency)"
    page_start: 1
    page_end: 1
    claim_classification: OFFICIAL_GUIDANCE
    topics: [transparency, explainability, decision_trace]
    text: >-
      The UAE seeks to create a clear understanding of AI and how systems operate and make decisions,
      which helps build trust, enhance responsibility, and accountability in the use of these technologies.
    support_note: >-
      The nearest national basis for publishing ordered decision traces (proposal -> gate -> transition
      -> evidence) rather than an opaque model output.

  - chunk_id: U5-p12-applicable-laws
    section_id: "Principle 12 (Commitment to Treaties and Applicable Laws)"
    page_start: 1
    page_end: 1
    claim_classification: OFFICIAL_GUIDANCE
    topics: [compliance, applicable_law, instrument_selection]
    text: >-
      The UAE emphasizes the importance of complying with international treaties and local laws in the
      development and use of AI.
    support_note: >-
      The Charter itself defers to sectoral law. For a health workflow that means Federal Law 2/2019,
      not the Charter: the same deferral pattern as PDPL Article 3(e), which is why instrument
      resolution cannot be skipped.
