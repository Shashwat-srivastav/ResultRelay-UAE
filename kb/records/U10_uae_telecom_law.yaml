# UAE Federal Decree-Law No. 3 of 2003 (Telecommunications), as amended - Article 13, the regulator's mandate.
# English consolidated text (TRA edition) via WIPO Lex; the Arabic version prevails. Binding on the regulator.
source_id: U10
excerpts:
  - chunk_id: U10-art13-1-2-mandate
    section_id: "Article 13(1)-(2)"
    page_start: 12
    page_end: 12
    claim_classification: BINDING_REQUIREMENT
    topics: [telecom, regulator_mandate, tdra, subscribers, service_level]
    text: >-
      The Authority shall exercise its functions and powers under this Federal Law by Decree and its Executive
      Order to: 1- ensure that the Telecommunications Services provided throughout the State, are sufficient to
      satisfy the public demands of those who wish to make use of such services; 2- enhance the level of service
      provided by the telecommunications sector in order to promote the interests of subscribers
    support_note: >-
      TDRA's statutory mandate is service sufficiency and subscribers' interests. It says nothing about evidence
      that a transactional clinical message reached a person: that question falls between this law and DHA ST-28
      §11.1.3 (gap GR-15). This is the mandate the network agent speaks for.

  - chunk_id: U10-art13-3-quality
    section_id: "Article 13(3)"
    page_start: 12
    page_end: 12
    claim_classification: BINDING_REQUIREMENT
    topics: [telecom, regulator_mandate, quality_of_service, licensees]
    text: >-
      3- ensure that Licensees meet quality standards of performance and adhere to the terms and conditions of the
      Licenses granted to them;
    support_note: Quality-of-service standards are the regulator's lever over delivery; none retrieved addresses clinical messages.
