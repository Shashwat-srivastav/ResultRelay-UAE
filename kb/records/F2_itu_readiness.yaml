    topics: [readiness, dimensions, policy, mapping]
    text: >-
      The AI Policy dimension evaluates the maturity of institutional frameworks essential for trustworthy
      and responsible AI ecosystems. We selected AI Policy and Regulation, Regulatory Quality, and
      Implementation as they collectively represent the indispensable triad for accountable AI systems.
    support_note: Verifies the published AI Policy dimension and its three indices. Mapping target for the policy/governance perspective.

