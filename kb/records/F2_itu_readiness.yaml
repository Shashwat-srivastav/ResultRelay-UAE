    text: >-
      The Innovation Ecosystem assesses the broader environment that nurtures and accelerates the
      advancement and adoption of Artificial Intelligence. It focuses on the critical inputs and
      collaborative dynamics that transform research into tangible progress and practical applications.
      We examine six key dimensions: standards, Engagement in Open source, R&D, investment, GenAI
      Content, and AI Technology market size.
    support_note: The only verified anchor for open-source and standards mapping in Report 2.0. Note the published index list here differs slightly from the summary table (which omits GenAI Content) - recorded as a source-internal inconsistency.

