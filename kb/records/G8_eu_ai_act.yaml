# European Union - Regulation (EU) 2024/1689 (AI Act), Articles 14, 26, 73 (GLOBAL COMPARATOR).
# PROVENANCE: verified against the artificialintelligenceact.eu copy (EUR-Lex refuses scripted clients);
# that copy inserts glossary pop-ups mid-sentence, so only clean spans are quoted. Pages 1-3 = Arts 14, 26, 73.
source_id: G8
excerpts:
  - chunk_id: G8-art14-1-human-oversight
    section_id: "Article 14(1)"
    page_start: 1
    page_end: 1
    claim_classification: GLOBAL_COMPARATOR
    topics: [ai_governance, human_oversight, comparator]
    text: >-
      High-risk AI systems shall be designed and developed in such a way, including with appropriate human-machine
      interface tools, that they can be effectively overseen by natural persons during the period in which they are
      in use.
    support_note: The EU counterpart to DHA PP-09 §4.4.2 (override by designated end users).

  - chunk_id: G8-art26-2-deployer-oversight
    section_id: "Article 26(2)"
    page_start: 2
    page_end: 2
    claim_classification: GLOBAL_COMPARATOR
    topics: [ai_governance, accountability, deployer, human_oversight]
    text: >-
      Deployers shall assign human oversight to natural persons who have the necessary competence, training and
      authority, as well as the necessary support.
    support_note: >-
      The EU names who oversees (the deployer, through competent natural persons). DHA PP-09 §4.2.1 leaves
      accountability to be "agreed" among parties, with no default owner (gap GR-17).

  - chunk_id: G8-art73-2-incident-deadline
    section_id: "Article 73(2)"
    page_start: 3
    page_end: 3
    claim_classification: GLOBAL_COMPARATOR
    topics: [ai_governance, incident_reporting, deadline]
    text: >-
      in any event, not later than 15 days after the provider
    support_note: >-
      Fragment (the copy breaks the sentence with a glossary pop-up): a serious incident must be reported "in any
      event, not later than 15 days after the provider" becomes aware of it. DHA PP-09 §4.8.1 requires AI incidents
      to be reported to DHA-HRS but sets no deadline (gap GR-17).
